name: 🚀 Ai Driven Devops - Actions

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'src/**'
      - 'action.yml'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - comprehensive

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
              
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }} 
      
      - name: 🏗️ Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/roxsross/ai-driven-devops:latest
            ghcr.io/roxsross/ai-driven-devops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: ✅ Build Complete
        run: |
          echo "✅ Multi-arch image published successfully"
          echo "📦 Image: ghcr.io/roxsross/ai-driven-devops:latest"
          echo "🔗 Digest: ${{ steps.build.outputs.digest }}"

  # Quick smoke test
  smoke-test:
    name: 💨 Smoke Test
    needs: build
    runs-on: ubuntu-latest
    outputs:
      smoke-passed: ${{ steps.validate.outputs.passed }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 💨 Quick Smoke Test
        id: smoke
        uses: ./
        with:
          model-provider: 'bedrock'
          simulation-mode: 'true'
          namespace: 'smoke-test'
          app-name: 'smoke-test-app'
          health-threshold: '75'
          blocking-mode: 'false'
          ci-pipeline-id: ${{ github.run_id }}
          ci-environment: 'post-build-validation'
          ci-commit-sha: ${{ github.sha }}
      
      - name: ✅ Validate Smoke Test
        id: validate
        run: |
          if [ -z "${{ steps.smoke.outputs.health-score }}" ] || 
             [ -z "${{ steps.smoke.outputs.recommendation }}" ]; then
            echo "❌ Smoke test failed - missing outputs"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Smoke test passed"
          echo "📊 Health Score: ${{ steps.smoke.outputs.health-score }}%"
          echo "🎯 Recommendation: ${{ steps.smoke.outputs.recommendation }}"
          echo "passed=true" >> $GITHUB_OUTPUT


  ai-gate-example:
    name: 🤖 AI Gate Example
    needs: smoke-test
    runs-on: ubuntu-latest
    if: needs.smoke-test.outputs.smoke-passed == 'true'
    strategy:
      fail-fast: false
      matrix:
        provider: [bedrock, claude, openai]
        environment: [development, staging]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🤖 AI Gate Test - ${{ matrix.provider }}
        id: ai-test
        continue-on-error: true
        uses: ./
        with:
          model-provider: ${{ matrix.provider }}
          simulation-mode: 'true'
          namespace: 'ai-demo-app'
          app-name: 'demo-application'
          health-threshold: '70'
          blocking-mode: 'false'
          ci-pipeline-id: ${{ github.run_id }}
          ci-environment: ${{ matrix.environment }}
          ci-commit-sha: ${{ github.sha }}
      
      - name: 📊 Display Results
        run: |
          echo "## 🤖 AI Gate Results - ${{ matrix.provider }} (${{ matrix.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.ai-test.outcome }}" = "success" ]; then
            echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "| Health Score | ${{ steps.ai-test.outputs.health-score }}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Critical Issues | ${{ steps.ai-test.outputs.critical-issues }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Recommendation | ${{ steps.ai-test.outputs.recommendation }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Analysis | ${{ steps.ai-test.outputs.analysis-summary }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            echo "| Error | Test failed or timed out |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  build-summary:
    name: 📋 Build Summary
    runs-on: ubuntu-latest
    needs: [build, smoke-test, ai-gate-example]
    if: always()
    
    steps:
      - name: 📊 Generate Summary Report
        run: |
          echo "## 🚀 Build, Test & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} | Multi-arch image published |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result == 'success' && '✅ Passed' || '❌ Failed' }} | Basic functionality validated |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Gate Example | ${{ needs.ai-gate-example.result == 'success' && '✅ Passed' || '❌ Failed' }} | Multi-provider AI testing |" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario Tests | ${{ needs.scenario-tests.result == 'success' && '✅ Passed' || needs.scenario-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Different threshold scenarios |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [ "${{ needs.build.result }}" = "success" ] && 
             [ "${{ needs.smoke-test.result }}" = "success" ] && 
             [ "${{ needs.ai-gate-example.result }}" = "success" ]; then
            echo "### 🎉 Overall Status: BUILD & TESTS SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Docker image built and published**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Action functionality validated**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **AI Gate example tests passed**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Multi-provider compatibility confirmed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **The action is ready for production use!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Published Images" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/roxsross/ai-driven-devops:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/roxsross/ai-driven-devops:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Overall Status: SOME ISSUES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some build or test steps failed**" >> $GITHUB_STEP_SUMMARY
            echo "🔍 **Please review the failed steps above**" >> $GITHUB_STEP_SUMMARY
            echo "🛠️ **Fix issues before using in production**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Use the action in your workflows: \`uses: roxsross/ai-driven-devops@main\`" >> $GITHUB_STEP_SUMMARY
          echo "- Check out the templates in \`examples-workflows/templates/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run integration tests with real secrets if needed" >> $GITHUB_STEP_SUMMARY
          echo "- Review documentation for advanced usage" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎉 Success Notification
        if: needs.build.result == 'success' && needs.smoke-test.result == 'success' && needs.ai-gate-example.result == 'success'
        run: |
          echo "🎉 BUILD & TEST PIPELINE COMPLETED SUCCESSFULLY!"
          echo ""
          echo "📦 Docker image published: ghcr.io/roxsross/ai-driven-devops:latest"
          echo "🧪 All tests passed successfully"
          echo "🤖 AI Gate functionality validated"
          echo "🚀 Action is ready for production use"
      
      - name: ⚠️ Issues Detected
        if: needs.build.result != 'success' || needs.smoke-test.result != 'success' || needs.ai-gate-example.result != 'success'
        run: |
          echo "⚠️ BUILD OR TEST PIPELINE HAD ISSUES"
          echo ""
          echo "🔍 Please check the summary above for details"
          echo "🛠️ Fix any issues before using the action"
          exit 1