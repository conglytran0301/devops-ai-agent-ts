apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx-demo-rules
  namespace: monitoring
  labels:
    app: nginx-demo
    release: prometheus
spec:
  groups:
  - name: nginx-demo.rules
    interval: 15s
    rules:
    # High Error Rate Alert
    - alert: NginxHighErrorRate
      expr: |
        (
          rate(nginx_http_requests_total{status=~"5.."}[5m]) /
          rate(nginx_http_requests_total[5m])
        ) * 100 > 5
      for: 2m
      labels:
        severity: warning
        service: nginx-demo
      annotations:
        summary: "High error rate detected in nginx-demo"
        description: "Error rate is {{ $value }}% for nginx-demo in namespace {{ $labels.namespace }}"
    
    # High Response Time Alert
    - alert: NginxHighLatency
      expr: |
        histogram_quantile(0.95, 
          rate(nginx_http_request_duration_seconds_bucket[5m])
        ) > 0.5
      for: 2m
      labels:
        severity: warning
        service: nginx-demo
      annotations:
        summary: "High latency detected in nginx-demo"
        description: "95th percentile latency is {{ $value }}s for nginx-demo"
    
    # Pod Memory Usage High
    - alert: NginxHighMemoryUsage
      expr: |
        (
          container_memory_working_set_bytes{container="nginx", namespace="demo"} /
          container_spec_memory_limit_bytes{container="nginx", namespace="demo"}
        ) * 100 > 80
      for: 1m
      labels:
        severity: warning
        service: nginx-demo
      annotations:
        summary: "High memory usage in nginx-demo pod"
        description: "Memory usage is {{ $value }}% for pod {{ $labels.pod }}"
    
    # Pod CPU Usage High
    - alert: NginxHighCPUUsage
      expr: |
        (
          rate(container_cpu_usage_seconds_total{container="nginx", namespace="demo"}[5m]) /
          container_spec_cpu_quota{container="nginx", namespace="demo"} * 
          container_spec_cpu_period{container="nginx", namespace="demo"}
        ) * 100 > 80
      for: 2m
      labels:
        severity: warning
        service: nginx-demo
      annotations:
        summary: "High CPU usage in nginx-demo pod"
        description: "CPU usage is {{ $value }}% for pod {{ $labels.pod }}"
    
    # Pod Restart Rate High
    - alert: NginxHighRestartRate
      expr: |
        rate(kube_pod_container_status_restarts_total{container="nginx", namespace="demo"}[15m]) > 0
      for: 0m
      labels:
        severity: critical
        service: nginx-demo
      annotations:
        summary: "nginx-demo pod is restarting frequently"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
    
    # Pod Not Ready
    - alert: NginxPodNotReady
      expr: |
        kube_pod_status_ready{condition="false", namespace="demo", pod=~"nginx-demo-.*"} == 1
      for: 1m
      labels:
        severity: critical
        service: nginx-demo
      annotations:
        summary: "nginx-demo pod is not ready"
        description: "Pod {{ $labels.pod }} has been not ready for more than 1 minute"